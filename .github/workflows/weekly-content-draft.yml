name: Weekly scheduled publish

on:
  schedule:
    # Mondays, 08:00 Prague during summer time and 07:00 during winter time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish due scheduled posts
        run: python scripts/publish_scheduled_posts.py

      - name: Commit published posts
        run: |
          if git diff --quiet; then
            echo "No scheduled posts due."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish scheduled weekly blog post"
          git push

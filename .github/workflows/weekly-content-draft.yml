name: Weekly content draft

on:
  schedule:
    # Mondays, 08:00 Prague during summer time and 07:00 during winter time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      BLOG_BASE_URL: "https://gabrielhasik.com"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate weekly draft
        run: python scripts/weekly_content_draft.py

      - name: Validate generated draft
        run: |
          test -f .weekly-content-output
          cat .weekly-content-output
          ARTICLE_PATH="$(sed -n 's/^article_path=//p' .weekly-content-output)"
          LINKEDIN_PATH="$(sed -n 's/^linkedin_path=//p' .weekly-content-output)"
          test -f "$ARTICLE_PATH"
          test -f "$LINKEDIN_PATH"
          grep -q "</html>" "$ARTICLE_PATH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .weekly-content-output
          BRANCH="weekly-content-draft/${draft_date}-${topic_id}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- "$draft_dir"
          git commit -m "Prepare weekly content draft: ${topic_title}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Weekly draft: ${topic_title}" \
            --body-file "$approval_path"

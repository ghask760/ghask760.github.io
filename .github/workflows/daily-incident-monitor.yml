name: Daily incident monitor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-incident-monitor.yml"
      - "scripts/daily_incident_monitor.py"
  schedule:
    # Frequent morning attempts because GitHub scheduled workflows can be delayed or dropped.
    # The script exits before scanning or calling OpenAI once the day already exists.
    - cron: "7,37 4-13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-incident-monitor
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daily incident monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          DAILY_MONITOR_MAX_CANDIDATES: "35"
          DAILY_MONITOR_MAX_ITEMS_PER_FEED: "12"
          DAILY_MONITOR_MAX_PUBLISHED: "8"
          DAILY_MONITOR_MAX_OUTPUT_TOKENS: "8000"
          DAILY_MONITOR_DAYS_BACK: "3"
        run: python scripts/daily_incident_monitor.py

      - name: Commit daily monitor update
        run: |
          if git diff --quiet; then
            echo "No daily monitor changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/daily_incident_monitor.json daily-incident-monitor.html
          git commit -m "Update daily incident monitor"
          git push

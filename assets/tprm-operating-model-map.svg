<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Who does what in a working third-party risk program</title>
  <desc id="desc">A decision-flow visual showing the responsibilities of procurement, business owner, security and risk, legal, supplier, and leadership in a third-party risk program.</desc>
  <defs>
    <style>
      .bg{fill:#0e0e0e}
      .card{fill:#141414;stroke:#242424;stroke-width:2}
      .card2{fill:#17120b;stroke:#3a2208;stroke-width:2}
      .line{stroke:#3a2208;stroke-width:4;fill:none}
      .soft{stroke:#242424;stroke-width:2;fill:none}
      .title{font-family:Georgia,'Times New Roman',serif;font-weight:700;fill:#f0e8dc}
      .mono{font-family:'Courier New',monospace;letter-spacing:2px;text-transform:uppercase;fill:#d4821a}
      .body{font-family:Arial,Helvetica,sans-serif;fill:#d8d0c4}
      .muted{font-family:Arial,Helvetica,sans-serif;fill:#999}
      .dim{font-family:Arial,Helvetica,sans-serif;fill:#666}
      .role{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#f0e8dc}
      .task{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#d8d0c4}
      .question{font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#777}
      .num{font-family:Georgia,'Times New Roman',serif;font-size:42px;font-weight:700;fill:#e8a84c}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3a2208"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <text x="80" y="82" class="mono" font-size="21">Third-party risk program</text>
  <text x="80" y="142" class="title" font-size="58">From Checkbox to Culture</text>
  <text x="80" y="186" class="muted" font-size="26">A simple operating map for who does what before a supplier risk decision is made.</text>

  <g filter="url(#shadow)">
    <rect x="520" y="245" width="560" height="165" rx="8" class="card2"/>
    <text x="800" y="296" class="mono" font-size="19" text-anchor="middle">The output</text>
    <text x="800" y="348" class="title" font-size="44" text-anchor="middle">Better supplier risk decisions</text>
    <text x="800" y="386" class="muted" font-size="23" text-anchor="middle">Not more questionnaires. Better ownership, evidence and escalation.</text>
  </g>

  <line x1="800" y1="410" x2="800" y2="455" class="line" marker-end="url(#arrow)"/>
  <rect x="455" y="455" width="690" height="72" rx="6" fill="#101010" stroke="#242424" stroke-width="2"/>
  <text x="800" y="501" class="mono" font-size="20" text-anchor="middle">Criticality -> Evidence -> Findings -> Decision -> Review</text>

  <g>
    <path d="M330 620 H520" class="line" marker-end="url(#arrow)"/>
    <path d="M785 620 H975" class="line" marker-end="url(#arrow)"/>
    <path d="M1320 620 C1420 620,1420 790,1320 790" class="line" marker-end="url(#arrow)"/>
    <path d="M975 790 H785" class="line" marker-end="url(#arrow)"/>
    <path d="M520 790 H330" class="line" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="545" width="250" height="150" rx="8" class="card"/>
    <text x="110" y="595" class="num">01</text>
    <text x="173" y="592" class="role">Procurement</text>
    <text x="110" y="637" class="task">Trigger review early</text>
    <text x="110" y="670" class="question">Before vendor selection</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="545" width="265" height="150" rx="8" class="card"/>
    <text x="550" y="595" class="num">02</text>
    <text x="613" y="592" class="role">Business</text>
    <text x="550" y="637" class="task">Define impact</text>
    <text x="550" y="670" class="question">What breaks if supplier fails?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="975" y="545" width="345" height="150" rx="8" class="card"/>
    <text x="1005" y="595" class="num">03</text>
    <text x="1068" y="592" class="role">Security &amp; Risk</text>
    <text x="1005" y="637" class="task">Review evidence and gaps</text>
    <text x="1005" y="670" class="question">What risk remains?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="975" y="715" width="345" height="150" rx="8" class="card"/>
    <text x="1005" y="765" class="num">04</text>
    <text x="1068" y="762" class="role">Legal</text>
    <text x="1005" y="807" class="task">Make commitments verifiable</text>
    <text x="1005" y="840" class="question">Clauses, audit, incident, exit</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="715" width="265" height="150" rx="8" class="card"/>
    <text x="550" y="765" class="num">05</text>
    <text x="613" y="762" class="role">Supplier</text>
    <text x="550" y="807" class="task">Provide evidence</text>
    <text x="550" y="840" class="question">Fix findings, report incidents</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="715" width="250" height="150" rx="8" class="card"/>
    <text x="110" y="765" class="num">06</text>
    <text x="173" y="762" class="role">Leadership</text>
    <text x="110" y="807" class="task">Decide and escalate</text>
    <text x="110" y="840" class="question">Accept, fix, avoid or exit</text>
  </g>

  <g>
    <rect x="1180" y="230" width="340" height="230" rx="8" fill="#101010" stroke="#242424" stroke-width="2"/>
    <text x="1210" y="278" class="mono" font-size="18">The test</text>
    <text x="1210" y="322" class="body" font-size="25">If a critical supplier</text>
    <text x="1210" y="354" class="body" font-size="25">is breached tomorrow,</text>
    <text x="1210" y="386" class="body" font-size="25">can you identify owner,</text>
    <text x="1210" y="418" class="body" font-size="25">impact and next action?</text>
  </g>

  <line x1="80" y1="925" x2="1520" y2="925" class="soft"/>
  <text x="80" y="962" class="dim" font-size="22">gabrielhasik.com</text>
  <text x="1520" y="962" class="dim" font-size="22" text-anchor="end">Critical suppliers | Useful evidence | Owned exceptions | Escalation</text>
</svg>
